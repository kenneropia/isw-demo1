<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interswitch Web Checkout Demo</title>
  <script src="https://sandbox.interswitchng.com/collections/public/javascripts/inline-checkout.js"></script>
</head>

<body>
  <div id="app">
    <div class="container">
      <h1>Interswitch Web Checkout Demo</h1>
      <form id="payment-form">
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="amount">Amount (NGN):</label>
          <input type="number" id="amount" min="100" required />
        </div>
        <div class="form-group">
          <label for="description">Payment Description:</label>
          <input type="text" id="description" required />
        </div>
        <div class="form-group">
          <label for="mobile">Mobile Number (Optional):</label>
          <input type="tel" id="mobile" />
        </div>
        <button type="submit">Pay Now</button>
      </form>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
