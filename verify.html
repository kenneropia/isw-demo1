<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Verification - Interswitch Demo</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .success {
            background-color: #f0fff4;
            border: 1px solid #68d391;
            padding: 1.5rem;
            border-radius: 0.5rem;
        }

        .error {
            background-color: #fff5f5;
            border: 1px solid #fc8181;
            padding: 1.5rem;
            border-radius: 0.5rem;
        }

        .result-details {
            margin-top: 1rem;
            padding: 1rem;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 0.25rem;
        }

        .amount-validation {
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div id="verification-result">
        <div class="loading">
            <p>Verifying transaction...</p>
        </div>
    </div>
    <script type="module" src="/src/verify.ts"></script>
</body>

</html>
